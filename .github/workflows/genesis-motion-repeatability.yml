name: Genesis motion repeatability (ROM-free)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quackshot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-repeatability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original-free fixed-point and repeatability regression suite
        run: |
          python3 -m unittest discover -s tests -p 'test_genesis_fixedpoint_motion.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_visual_roi_numeric.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_blue_roi_components.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_blue_roi_components_witness.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_blue_roi_components_triplet.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_city_visual_roi_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_visual_vdp_origin_crosscheck.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_city_same_step_triplet_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_city_video_vdp_bracket_probe.py' -v
          python3 tools/genesis_visual_vdp_origin_crosscheck.py --out city-vdp-visual-crosscheck.json
          python3 -m unittest discover -s tests -p 'test_genesis_city_fractional_fall_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_checkpoint_phase_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_private_genesis_input_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_private_genesis_report_output.py' -v
          python3 -m unittest discover -s tests -p 'test_city_original_contact_candidate.py' -v
          python3 -m unittest discover -s tests -p 'test_city_fractional_witness_comparison.py' -v
          python3 -m unittest discover -s tests -p 'test_city_y_anchor_identifiability.py' -v
          python3 tools/city_y_anchor_identifiability.py --out city-y-anchor-ambiguity.json
          python3 tools/city_fractional_witness_comparison.py --out city-fractional-baseline.json
          python3 - <<'PY'
          import json
          with open('city-fractional-baseline.json', encoding='utf-8') as f:
              report=json.load(f)
          assert report['status']=='NO_NEW_ORIGINAL_FRACTIONAL_MEASUREMENTS'
          assert report['original_fractional_threshold_intervals'] is None
          assert report['original_rom_executed_by_this_comparison'] is False
          print('STAGE189_FRACTIONAL_BASELINE_PASS: no private ROM was run')
          PY
          python3 -m unittest discover -s tests -p 'test_genesis_motion_repeatability.py' -v
          echo 'MOTION_REPEATABILITY_SYNTHETIC_PASS: no private ROM or original assets'
