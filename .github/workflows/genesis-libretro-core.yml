name: Genesis libretro core (ROM-free)
on:
  pull_request:
    paths:
      - ".github/workflows/genesis-libretro-core.yml"
      - "tools/genesis_libretro_probe.py"
      - "tools/genesis_blue_roi_numeric.py"
      - "tools/genesis_blue_roi_components.py"
      - "tests/test_genesis_blue_roi_components.py"
      - "tests/test_genesis_blue_roi_components_witness.py"
      - "tests/test_genesis_blue_roi_components_triplet.py"
      - "tools/genesis_vdp_hscroll_export.c"
      - "tools/genesis_cpu_write_trace_export.c"
      - "tools/genesis_city_video_vdp_bracket_probe.py"
      - "tools/ci_genesis_vdp_video_callback_smoke.py"
      - "tools/ci_genesis_blue_components_real_core.py"
      - "tests/test_ci_genesis_blue_components_real_core.py"
      - "tools/build_genesis_private_bundle.py"
      - "tests/test_build_genesis_private_bundle.py"
      - "tools/genesis_private_bundle_launcher.py"
      - "tests/test_genesis_private_bundle_launcher.py"
      - "tests/test_genesis_private_color_launcher.py"
      - "tools/genesis_offline_numeric_report_audit.py"
      - "tests/test_genesis_offline_numeric_report_audit.py"
      - "tools/genesis_private_cross_roi_consistency.py"
      - "tests/test_genesis_private_cross_roi_consistency.py"
      - "tools/genesis_private_input_intervention_audit.py"
      - "tests/test_genesis_private_input_intervention_audit.py"
      - "tools/genesis_full_frame_digest_audit.py"
      - "tests/test_genesis_full_frame_digest_audit.py"
      - "tests/test_ci_genesis_vdp_video_callback_smoke.py"
      - "tests/test_genesis_libretro_probe.py"
      - "tools/genesis_vdp_scroll_probe.py"
      - "tools/genesis_camera_phase_model.py"
      - "tests/test_genesis_camera_phase_model.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential zlib1g-dev
      - name: Fetch pinned Genesis Plus GX source (NO ROM)
        env:
          UPSTREAM_SHA: aa74d79634cd230f65cce4180e92688e53883d2f
        run: |
          git clone --depth 30 https://github.com/libretro/Genesis-Plus-GX.git emulator-core
          git -C emulator-core checkout --detach "$UPSTREAM_SHA"
          test "$(git -C emulator-core rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Enable numeric-only VDP HScroll inspection in ROM-free research core
        run: |
          cat tools/genesis_vdp_hscroll_export.c >> emulator-core/libretro/libretro.c
          grep -q 'quackshot_research_vdp_hscroll' emulator-core/libretro/libretro.c
          sed -i 's/global: retro_\*;/global: retro_*; quackshot_research_vdp_hscroll;/' emulator-core/libretro/link.T
          grep -q 'quackshot_research_vdp_hscroll' emulator-core/libretro/link.T
      - name: Compile Linux x86-64 libretro core
        run: |
          make -C emulator-core -f Makefile.libretro -j2 platform=unix HAVE_CHD=0 HAVE_CDROM=0
          test -s emulator-core/genesis_plus_gx_libretro.so
          file emulator-core/genesis_plus_gx_libretro.so
          ldd emulator-core/genesis_plus_gx_libretro.so
          nm -D emulator-core/genesis_plus_gx_libretro.so | grep ' retro_run$'
          nm -D emulator-core/genesis_plus_gx_libretro.so | grep ' quackshot_research_vdp_hscroll$'
          sha256sum emulator-core/genesis_plus_gx_libretro.so > emulator-sha256.txt
      - name: Check Python libretro frontend without proprietary game
        run: |
          python3 -m unittest discover -s tests -p 'test_genesis*.py' -v
          python3 tools/genesis_libretro_probe.py --core emulator-core/genesis_plus_gx_libretro.so --core-info
      - name: Emulate a synthetic noncommercial-content-free 68000 loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = bytearray(128 * 1024)
          data[0:4] = (0x00FFFF00).to_bytes(4, 'big')
          data[4:8] = (0x200).to_bytes(4, 'big')
          data[0x100:0x110] = b'SEGA MEGA DRIVE '
          data[0x120:0x150] = b'OPENAI TEST ONLY NO GAME ASSETS'.ljust(48, b' ')
          data[0x150:0x180] = b'INDEPENDENT SYNTHETIC CPU LOOP'.ljust(48, b' ')
          data[0x180:0x18e] = b'GM 99999999-00'
          data[0x1a4:0x1a8] = (len(data) - 1).to_bytes(4, 'big')
          data[0x1f0:0x1f1] = b'U'
          data[0x200:0x202] = bytes.fromhex('60fe')
          data[0x18e:0x190] = (0x60fe).to_bytes(2, 'big')
          Path('ci-only-synthetic.gen').write_bytes(data)
          PY
          python3 tools/genesis_libretro_probe.py --core emulator-core/genesis_plus_gx_libretro.so \
            --rom ci-only-synthetic.gen --frames 90 --video-stride 1 --video-digest-frames 0,1,89 --input 10:20:START --compare-to-idle \
            --output ci-only-observation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('ci-only-observation.json').read_text())
          assert r['frames_requested'] == 90, r
          assert r['frames_video_callbacks'] == 90, r
          assert r['input_polls'] == 90, r
          assert r['input_nonzero_reads'] >= 10, r
          assert r['system_ram_size'] == 65536, r
          assert r['video_stride'] == 1 and len(r['video_checkpoints']) == 90, r
          assert r['comparison_to_idle']['checkpoints_compared'] == 90, r
          assert r['comparison_to_idle']['core_input_nonzero_reads_idle'] == 0, r
          assert r['video_digest_frames_requested'] == [0, 1, 89], r
          digests = r['video_frame_digests']
          assert [x['frame'] for x in digests] == [0, 1, 89], digests
          assert all(len(x['sha256']) == 64 and len(x['visible_sha256']) == 64 for x in digests), digests
          assert all(x['visible_byte_count'] == x['size'][0] * x['size'][1] * (4 if x['pixel_format'] == 1 else 2) for x in digests), digests
          assert 'frame_pixels' not in r and 'raw_frame_bytes' not in r, r
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from genesis_input_causality import compare_checkpoints
          sample = {0: "AAAA", 1: "BBBB", 2: "CCCC"}
          difference = compare_checkpoints(sample, {0: "AAAA", 1: "EEEE", 2: "CCCC"})
          assert difference["first_changed_frame"] == 1
          assert difference["changed_count"] == 1
          print("GENESIS_CAUSALITY_SYNTHETIC_PASS")

          print('GENESIS_LIBRETRO_SYNTHETIC_PASS: 90 CPU/video frames, joypad polls, 64KiB RAM')
          PY
          python3 tools/genesis_input_causality.py --core emulator-core/genesis_plus_gx_libretro.so \
            --rom ci-only-synthetic.gen --expected-sha256 "$(sha256sum ci-only-synthetic.gen | cut -d' ' -f1)" \
            --frames 90 --base "" --variants "start_10@10:20:START" --stride 1 \
            --output ci-only-causal.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          witness = json.loads(Path('ci-only-causal.json').read_text())
          assert witness["baseline"]["repeat_identical"], witness
          assert witness["baseline"]["video_checkpoints"] == 90, witness
          actual = witness["variants"][0]
          assert actual["additional_nonzero_reads"] == 10, actual
          assert actual["video_crc_differences"]["changed_count"] == 0, actual
          assert actual["work_ram_crc_differences"]["changed_count"] == 0, actual
          print("GENESIS_REAL_CI_CAUSALITY_PASS: real core, synthetic ROM, repeatable frames & RAM")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from genesis_libretro_probe import safe_rom, setup_core, run_core
          from genesis_playable_physics import decode_player_state
          core, meta = setup_core(Path('emulator-core/genesis_plus_gx_libretro.so'))
          path = Path('ci-only-synthetic.gen')
          data, sha = safe_rom(path, None)
          observed = []
          def numeric_window(frame, private_ram):
              state = decode_player_state(private_ram)
              observed.append((frame, state["x"], state["y"]))
          result = run_core(core, meta, data, sha, 90, [], private_rom_path=path,
                            checkpoint_sink=numeric_window, ram_window=(10, 80))
          assert result['frames_video_callbacks'] == 90, result
          assert len([f for f,x,y in observed if 10 <= f < 80]) == 70, observed
          assert all(0 <= x <= 65535 and 0 <= y <= 65535 for _,x,y in observed)
          print('GENESIS_DENSE_RAM_PROBE_SYNTHETIC_PASS: per-frame window through real core')
          PY
          python3 -m unittest discover -s tests -p 'test_ci_genesis_vdp_video_callback_smoke.py' -v
          python3 tools/ci_genesis_vdp_video_callback_smoke.py \
            --core emulator-core/genesis_plus_gx_libretro.so \
            --rom ci-only-synthetic.gen
          python3 -m unittest discover -s tests -p 'test_ci_genesis_blue_components_real_core.py' -v
          python3 tools/ci_genesis_blue_components_real_core.py \
            --core emulator-core/genesis_plus_gx_libretro.so \
            --rom ci-only-synthetic.gen
          rm -f ci-only-synthetic.gen ci-only-observation.json ci-only-causal.json
      - name: Package licensed emulator only
        run: |
          mkdir -p rom-free-emulator
          cp emulator-core/genesis_plus_gx_libretro.so emulator-core/LICENSE.txt rom-free-emulator/
          cp tools/genesis_libretro_probe.py tools/genesis_blue_roi_numeric.py tools/genesis_blue_roi_components.py tools/genesis_input_causality.py tools/genesis_playable_physics.py tools/genesis_fixedpoint_motion.py tools/genesis_city_obstacle_probe.py tools/genesis_camera_state_probe.py tools/genesis_vdp_scroll_probe.py tools/genesis_camera_phase_model.py rom-free-emulator/
          (
            cd rom-free-emulator
            PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import genesis_libretro_probe
          import genesis_blue_roi_numeric
          import genesis_blue_roi_components
          import genesis_vdp_scroll_probe
          import genesis_input_causality
          import genesis_city_obstacle_probe
          print('STAGE202_EMULATOR_PACKAGE_PYTHON_IMPORTS_PASS')
          PY
          )
          cp emulator-sha256.txt rom-free-emulator/
          printf '%s\n' 'Upstream: https://github.com/libretro/Genesis-Plus-GX' \
            'Pinned source commit: aa74d79634cd230f65cce4180e92688e53883d2f' \
            'Binary compiled on Ubuntu 24.04, x86-64.' \
            'For private local inspection only. No game ROM or assets included.' \
            'Genesis Plus GX license: non-commercial redistribution; consult LICENSE.txt.' \
            > rom-free-emulator/BUILD_PROVENANCE.txt
      - name: Audit and package full private numeric research closure (no original ROM)
        run: |
          python3 -m unittest discover -s tests -p 'test_build_genesis_private_bundle.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_private_bundle_launcher.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_private_color_launcher.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_offline_numeric_report_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_private_cross_roi_consistency.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_private_input_intervention_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_genesis_full_frame_digest_audit.py' -v
          python3 tools/build_genesis_private_bundle.py --build --destination rom-free-emulator
          python3 tools/build_genesis_private_bundle.py --verify --destination rom-free-emulator
          (
            cd rom-free-emulator
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 - <<'PY'
          import genesis_city_video_vdp_bracket_probe
          import genesis_city_same_step_triplet_probe
          import genesis_city_visual_roi_probe
          import genesis_vdp_scroll_probe
          import genesis_offline_numeric_report_audit
          import genesis_private_cross_roi_consistency
          import genesis_private_input_intervention_audit
          import genesis_full_frame_digest_audit
          print('STAGE217_FULL_FRAME_DIGEST_AUDITOR_PACKAGE_IMPORTS_PASS')
          PY
          )
          python3 tools/build_genesis_private_bundle.py --verify --destination rom-free-emulator
          PYTHONDONTWRITEBYTECODE=1 python3 rom-free-emulator/tools/genesis_private_bundle_launcher.py \
            --preflight --bundle rom-free-emulator
          python3 tools/build_genesis_private_bundle.py --verify --destination rom-free-emulator
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-plus-gx-rom-free-linux-x64
          path: rom-free-emulator/
          retention-days: 7
          if-no-files-found: error
      - name: Build separate CPU-write-trace core (ROM-free)
        run: |
          cp -a emulator-core emulator-core-trace
          cat tools/genesis_cpu_write_trace_export.c >> emulator-core-trace/libretro/libretro.c
          # The pinned upstream hook header used a tentative global definition,
          # which modern -fno-common linkers reject across translation units.
          # Keep the single definition in cpuhook.c and make the header declaration external.
          sed -i 's/^void (\*cpu_hook)/extern void (*cpu_hook)/' emulator-core-trace/core/debug/cpuhook.h
          grep -q '^extern void (\*cpu_hook)' emulator-core-trace/core/debug/cpuhook.h
          sed -i 's/global: retro_\*; quackshot_research_vdp_hscroll;/global: retro_*; quackshot_research_vdp_hscroll; quackshot_research_cpu_trace_*; quackshot_research_cpu_pc_trace_*; quackshot_research_sat_*;/' emulator-core-trace/libretro/link.T
          grep -q 'quackshot_research_cpu_trace_reset' emulator-core-trace/libretro/libretro.c
          grep -Fq 'quackshot_research_cpu_trace_*' emulator-core-trace/libretro/link.T
          grep -Fq 'quackshot_research_cpu_pc_trace_*' emulator-core-trace/libretro/link.T
          grep -Fq 'quackshot_research_sat_*' emulator-core-trace/libretro/link.T
          make -C emulator-core-trace -f Makefile.libretro clean
          make -C emulator-core-trace -f Makefile.libretro -j2 platform=unix HAVE_CHD=0 HAVE_CDROM=0 HOOK_CPU=1 TARGET_NAME=genesis_plus_gx_cpu_trace
          test -s emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so
          nm -D emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so | grep ' quackshot_research_cpu_trace_reset$'
          nm -D emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so | grep ' quackshot_research_cpu_trace_read$'
          nm -D emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so | grep ' quackshot_research_cpu_pc_trace_read$'
          nm -D emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so | grep ' quackshot_research_sat_count$'
          nm -D emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so | grep ' quackshot_research_sat_read$'
          ldd emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so
          mkdir -p cpu-trace-emulator/tools
          cp emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so cpu-trace-emulator/
          cp emulator-core-trace/LICENSE.txt cpu-trace-emulator/
          cp tools/genesis_libretro_probe.py tools/genesis_blue_roi_numeric.py tools/genesis_blue_roi_components.py cpu-trace-emulator/tools/
          sha256sum cpu-trace-emulator/genesis_plus_gx_cpu_trace_libretro.so > cpu-trace-emulator/emulator-sha256.txt
          printf '%s\n' 'Upstream: https://github.com/libretro/Genesis-Plus-GX' \
            'Pinned source commit: aa74d79634cd230f65cce4180e92688e53883d2f' \
            'Separate research-only build with HOOK_CPU=1 and bounded numeric Work RAM write, PC/A0/CCR and parsed VDP SAT tracing.' \
            'PC trace records selected PCs and A0/CCR; at PC 0x00B866 it accepts aligned object-pool A0 slots to identify the event writer.' \
            'SAT and object APIs return decoded numeric metadata only; no raw RAM/VRAM bytes are exported.' \
            'Build-only fix: cpuhook.h declares cpu_hook extern; cpuhook.c retains its single definition.' \
            'No original game ROM, raw RAM/VRAM dump, instruction bytes, framebuffer, graphics or audio included.' \
            'See LICENSE.txt; modified upstream source is included in the source archive.' \
            > cpu-trace-emulator/BUILD_PROVENANCE.txt
          tar --exclude='.git' --exclude='*.o' --exclude='*.so' --exclude='*.a' \
            -czf "$GITHUB_WORKSPACE/cpu-trace-emulator/genesis-plus-gx-cpu-trace-source.tar.gz" \
            -C emulator-core-trace .
          cp tools/genesis_cpu_write_trace_export.c cpu-trace-emulator/
          python3 - <<'PY'
          from pathlib import Path
          data = bytearray(128 * 1024)
          data[0:4] = (0x00FFFF00).to_bytes(4, 'big')
          data[4:8] = (0x200).to_bytes(4, 'big')
          data[0x100:0x110] = b'SEGA MEGA DRIVE '
          data[0x120:0x150] = b'OPENAI SYNTHETIC CPU TRACE ONLY'.ljust(48, b' ')
          data[0x150:0x180] = b'NO GAME ASSETS OR ORIGINAL ROM'.ljust(48, b' ')
          data[0x180:0x18e] = b'GM 99999999-00'
          data[0x18e:0x190] = (0x207c).to_bytes(2, 'big')
          data[0x1a4:0x1a8] = (len(data) - 1).to_bytes(4, 'big')
          data[0x1f0:0x1f1] = b'U'
          data[0x200:0x206] = bytes.fromhex('207c00ffa300')
          data[0x206:0x20e] = bytes.fromhex('33fc123400ffa2e6')
          data[0x20e:0x214] = bytes.fromhex('4ef90000b860')
          data[0xB860:0xB866] = bytes.fromhex('4e714e714e71')
          data[0xB866:0xB86c] = bytes.fromhex('11fc00ffee09')
          data[0xB86c:0xB86e] = bytes.fromhex('60fe')
          Path('ci-only-cpu-trace.gen').write_bytes(data)
          PY
          python3 tools/genesis_libretro_probe.py \
            --core emulator-core-trace/genesis_plus_gx_cpu_trace_libretro.so \
            --rom ci-only-cpu-trace.gen --frames 90 --video-stride 1 \
            --cpu-write-trace-window 0:89 --cpu-control-flow-trace-window 0:89 \
            --sat-snapshot-frames 0,89 --object-record-snapshot-frames 0,89 \
            --output ci-only-cpu-trace-observation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ci-only-cpu-trace-observation.json').read_text())
          trace = report['cpu_write_trace']
          assert trace['schema'] == 'quackshot_private_m68k_cpu_write_trace_v1', trace
          assert trace['status'] == 'COMPLETE' and trace['overflow_count'] == 0, trace
          assert trace['frame_window_inclusive'] == [0, 89], trace
          assert trace['event_count'] == 2 and len(trace['events']) == 2, trace
          timer_event = next(e for e in trace['events'] if e['cpu_address'] == 0xFFA2E6)
          assert timer_event == {
              'frame': 0, 'instruction_pc': 0x206, 'cpu_address': 0xFFA2E6,
              'ram_offset': 0xA2E6, 'width_bytes': 2, 'write_value': 0x1234
          }, timer_event
          event_flag = next(e for e in trace['events'] if e['cpu_address'] == 0xFFEE09)
          assert event_flag == {
              'frame': 0, 'instruction_pc': 0xB866, 'cpu_address': 0xFFEE09,
              'ram_offset': 0xEE09, 'width_bytes': 1, 'write_value': 0xFF
          }, event_flag
          assert trace['raw_rom_exported'] is False, trace
          assert trace['raw_ram_exported'] is False, trace
          assert trace['instruction_bytes_exported'] is False, trace
          pc_trace = report['cpu_control_flow_trace']
          assert pc_trace['schema'] == 'quackshot_private_m68k_control_flow_trace_v2', pc_trace
          assert pc_trace['status'] == 'COMPLETE' and pc_trace['overflow_count'] == 0, pc_trace
          assert pc_trace['frame_window_inclusive'] == [0, 89], pc_trace
          assert pc_trace['event_count'] == 1 and len(pc_trace['events']) == 1, pc_trace
          pc_event = pc_trace['events'][0]
          assert pc_event['frame'] == 0 and pc_event['instruction_pc'] == 0xB866, pc_event
          assert pc_event['a0_address'] == 0xFFA300, pc_event
          assert pc_trace['collision_event_writer_pc'] == '0x00B866', pc_trace
          assert 'any A0 value' in pc_trace['object_pointer_filter'], pc_trace
          assert 0 <= pc_event['ccr_low5'] <= 0x1F, pc_event
          assert pc_trace['raw_rom_exported'] is False, pc_trace
          assert pc_trace['raw_ram_exported'] is False, pc_trace
          assert pc_trace['instruction_bytes_exported'] is False, pc_trace
          sat = report['sat_sprite_trace']
          assert sat['schema'] == 'quackshot_private_genesis_vdp_sat_numeric_v1', sat
          assert sat['status'] == 'COMPLETE', sat
          assert sat['frame_indices_requested'] == [0, 89], sat
          assert len(sat['frames']) == 2, sat
          assert sat['raw_vram_exported'] is False and sat['raw_sat_bytes_exported'] is False, sat
          assert sat['frame_pixels_exported'] is False and sat['audio_exported'] is False, sat
          for snapshot in sat['frames']:
            assert snapshot['entry_count'] == len(snapshot['sprites']) <= 80, snapshot
            for sprite in snapshot['sprites']:
              assert 0 <= sprite['sprite_index'] < 80, sprite
              assert -128 <= sprite['x_screen'] <= 383, sprite
              assert -128 <= sprite['y_screen'] <= 383, sprite
              assert sprite['width'] in (8, 16, 24, 32), sprite
              assert sprite['height'] in (8, 16, 24, 32), sprite
              assert 0 <= sprite['pattern_index'] <= 0x7FF, sprite
              assert 0 <= sprite['palette'] <= 3, sprite
              assert sprite['priority'] in (0, 1) and sprite['hflip'] in (0, 1) and sprite['vflip'] in (0, 1), sprite
              assert 0 <= sprite['next_link'] < 80, sprite
          obj = report['object_record_trace']
          assert obj['schema'] == 'quackshot_private_object_record_numeric_v2', obj
          assert obj['status'] == 'COMPLETE', obj
          assert obj['frame_indices_requested'] == [0, 89], obj
          assert len(obj['frames']) == 2, obj
          assert obj['raw_ram_exported'] is False and obj['raw_rom_exported'] is False, obj
          assert obj['instruction_bytes_exported'] is False, obj
          assert obj['frame_pixels_exported'] is False and obj['audio_exported'] is False, obj
          for snapshot in obj['frames']:
            assert snapshot['object_cpu_address'] == '0xFFA2C0', snapshot
            assert snapshot['timer_26'] == 0x1234, snapshot
            assert snapshot['animation_pointer'] == '0x00000000', snapshot
            assert snapshot['global_event_ee08'] == '0x00', snapshot
            assert snapshot['global_event_ee09'] == '0xFF', snapshot
            assert snapshot['global_collision_gate_ee62'] == '0x00', snapshot
            assert 0 <= snapshot['state_code'] <= 0x7FFF, snapshot
            assert 0 <= snapshot['world_x_fixed16_16'] <= 0xFFFFFFFF, snapshot
            assert 0 <= snapshot['world_y_fixed16_16'] <= 0xFFFFFFFF, snapshot
          assert 'raw_pixels' not in report and 'frame_pixels' not in report, report
          print('STAGE221_SYNTHETIC_M68K_PC_A0_CCR_TRACE_PASS')
          print('STAGE223_SYNTHETIC_NUMERIC_VDP_SAT_PASS')
          print('STAGE225_SYNTHETIC_OBJECT_RECORD_SNAPSHOT_PASS')
          print('STAGE227_SYNTHETIC_COLLISION_EVENT_WRITER_TRACE_PASS')
          PY
          rm -f ci-only-cpu-trace.gen ci-only-cpu-trace-observation.json
          find cpu-trace-emulator -type f -print0 | xargs -0 file
          if find cpu-trace-emulator -type f | grep -E '\.(gen|rom|sav|srm|bk2|png|wav|mp3)$'; then
            echo "Unexpected game/media artifact in CPU trace package" >&2
            exit 1
          fi
