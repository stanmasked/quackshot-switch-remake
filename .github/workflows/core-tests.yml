name: Portable gameplay core
on:
  push:
    branches: [main]
  pull_request:

# Keep the newest PR revision moving instead of queueing every obsolete
# intermediate commit. Separate groups per workflow (not globally)
# preserve parallel core, NRO, and NeXium checks for the same HEAD.
# Default-branch pushes are not cancelled so the main build remains auditable.
concurrency:
  group: quackshot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Verify per-workflow PR concurrency policy
        run: python3 -m unittest discover -s tests -p 'test_ci_concurrency.py' -v
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build-desktop -DQS_BUILD_DESKTOP=OFF -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build-desktop --parallel
      - name: Test
        run: ctest --test-dir build-desktop --output-on-failure
      - name: Record deterministic rational-timeline digest
        run: |
          ./build-desktop/qs_city_fraction_tests > timeline-digest.txt
          cat timeline-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: city-timeline-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: timeline-digest.txt
          if-no-files-found: error
  compare-city-timeline:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: city-timeline-*
          path: city-timeline-results
      - name: Compare GCC/Clang Debug/Release timeline digests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = sorted(Path("city-timeline-results").glob("city-timeline-*/timeline-digest.txt"))
          assert len(roots) == 4, [str(p) for p in roots]
          values = [p.read_text().strip() for p in roots]
          for p, v in zip(roots, values):
              assert v.startswith("TIMELINE_DIGEST="), (p, v)
              print(f"{p.parent.name}: {v}")
          assert len(set(values)) == 1, values
          print("CITY_CROSS_COMPILER_PASS: four identical exact-timeline digests")
          PY
  sdl-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S . -B build-desktop -DQS_BUILD_DESKTOP=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-desktop --parallel
      - name: Verify desktop executable
        run: test -x build-desktop/quackshot-prototype
      - name: Headless SDL2 rendered-frame smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          QS_TRACE_PATH: smoke-runtime.csv
        run: |
          ./build-desktop/quackshot-prototype --smoke | tee smoke.log
          grep -q '^SDL_SMOKE_PASS ' smoke.log
          grep -q '^PROGRESS_MAP_SDL_PASS ' smoke.log
          grep -q '^MULTISTAGE_MAP_SDL_PASS:' smoke.log
          grep -q '^MAP_CHORD_SDL_PASS:' smoke.log
          grep -q '^FINISH_CHORD_SDL_PASS:' smoke.log
          grep -q '^EXIT_INTERACTION_SDL_PASS:' smoke.log
          grep -q '^RETRY_PICKUP_SDL_PASS:' smoke.log
          grep -q '^MULTI_ENEMY_IMMUNITY_SDL_PASS:' smoke.log
          grep -q '^COPLANAR_IMPACTS_SDL_PASS:' smoke.log
          grep -q '^MULTISHOT_PRIORITY_SDL_PASS:' smoke.log
          grep -q '^OPPOSING_TIES_SDL_PASS:' smoke.log
          grep -q '^GLOBAL_TIMELINE_SDL_PASS:' smoke.log
          grep -q '^VELOCITY_GUARD_SDL_PASS:' smoke.log
          grep -q '^ENEMY_NUMERIC_SDL_PASS:' smoke.log
          grep -q '^HERO_CAMERA_NUMERIC_SDL_PASS:' smoke.log
          grep -q '^NUMERIC_TRANSITION_SDL_PASS:' smoke.log
          grep -q '^PICKUP_NUMERIC_SDL_PASS:' smoke.log
          grep -q '^FRAME_ARBITRATION_SDL_PASS:' smoke.log
          grep -q '^TIMER_BOUNDARY_SDL_PASS:' smoke.log
          grep -q '^HERO_STATUS_SDL_PASS:' smoke.log
          grep -q '^PRE_MOVE_SHOTS_SDL_PASS:' smoke.log
          grep -q '^WEAPON_QUEUE_SDL_PASS:' smoke.log
          grep -q '^MAP_INTEGRITY_SDL_PASS:' smoke.log
          grep -q '^SCENE_RECOVERY_SDL_PASS:' smoke.log
          grep -q '^SHOT_CANONICAL_SDL_PASS:' smoke.log
          grep -q '^CITY_CHECKPOINT_SDL_PASS:' smoke.log
          grep -q '^CHECKPOINT_HUD_SDL_PASS:' smoke.log
          grep -q '^BONUS_BEACONS_SDL_PASS:' smoke.log
          grep -q '^BONUS_SET_HEAL_SDL_PASS:' smoke.log
          grep -q '^BONUS_SCORE_SDL_PASS:' smoke.log
          grep -q '^PERSONAL_BEST_SDL_PASS:' smoke.log
          grep -q '^MAP_BEST_SCORE_SDL_PASS:' smoke.log
          grep -q '^CROSS_STAGE_RECORD_SDL_PASS:' smoke.log
          grep -q '^CITY_TIME_TRIAL_SDL_PASS:' smoke.log
          grep -q '^CITY_SPLIT_SDL_PASS:' smoke.log
          grep -q '^CHECKPOINT_PACE_SDL_PASS:' smoke.log
          grep -q '^CITY_QUICK_RETRY_SDL_PASS:' smoke.log
          grep -q '^CRATE_SDL_PASS:' smoke.log
          grep -q '^CRATE_DEBRIS_SDL_PASS:' smoke.log
          grep -q '^CRATE_PRIORITY_SDL_PASS:' smoke.log
          grep -q '^CITY_PAUSE_SDL_PASS:' smoke.log
          grep -q '^CITY_SECTOR_SDL_PASS:' smoke.log
          python3 - <<'PY'
          import csv
          with open("smoke-runtime.csv", newline="") as f:
              records = list(csv.DictReader(f))
          assert [int(row["event"]) for row in records] == [1,2,3,4,11,9], records
          assert [int(row["seq"]) for row in records] == list(range(len(records)))
          assert all(int(row["detail"]) == 0 for row in records if int(row["event"]) != 4), records
          assert int(records[3]["detail"]) in (0, 1), records
          print("TRACE_SMOKE_PASS: ordered asset-free boot/render/shutdown events")
          PY
      - name: Verify actual two-plane SDL rendered pixel offsets (2:1)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          QS_TRACE_PATH: parallax-runtime.csv
        run: |
          ./build-desktop/quackshot-prototype --parallax-smoke | tee parallax-pixels.log
          grep -q '^PARALLAX_SDL_PASS:' parallax-pixels.log
          python3 - <<'PY'
          import csv
          with open("parallax-runtime.csv", newline="") as fh:
              rows=list(csv.DictReader(fh))
          assert [int(r["event"]) for r in rows] == [1,2,3,4,11,9], rows
          assert int(rows[4]["detail"]) == 0, rows
          print("PARALLAX_TRACE_PASS: ordered guest-compatible SDL render proof")
          PY
      - name: Verify city camera latch across hero, terrain, objects and both SDL layers
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          QS_TRACE_PATH: camera-latch-runtime.csv
        run: |
          ./build-desktop/quackshot-prototype --camera-latch-smoke | tee camera-latch-pixels.log
          grep -q '^CAMERA_LATCH_SDL_PASS:' camera-latch-pixels.log
          python3 - <<'PY'
          import csv
          with open("camera-latch-runtime.csv", newline="") as fh:
              rows=list(csv.DictReader(fh))
          assert [int(r["event"]) for r in rows] == [1,2,3,4,11,9], rows
          assert int(rows[4]["detail"]) == 0, rows
          assert [int(r["seq"]) for r in rows] == list(range(len(rows))), rows
          print("CAMERA_LATCH_TRACE_PASS: software raster evidence and clean shutdown")
          PY
      - name: Verify actual first frame and 600-frame heartbeat
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          QS_TRACE_PATH: probe-runtime.csv
        run: |
          ./build-desktop/quackshot-prototype --probe-frames 605
          python3 - <<'PY'
          import csv
          with open("probe-runtime.csv", newline="") as f:
              rows = list(csv.DictReader(f))
          events = [int(r["event"]) for r in rows]
          assert events[:4] == [1, 2, 3, 4], events
          assert events.count(5) == 1, events
          assert 8 in events and events[-1] == 9, events
          assert int(rows[-1]["frames"]) >= 605, rows
          assert [int(r["seq"]) for r in rows] == list(range(len(rows)))
          print("RUNTIME_PROBE_PASS: first frame, 600-frame heartbeat, clean shutdown")
          PY
      - name: Verify SDL initialization errors appear in CSV
        env:
          SDL_VIDEODRIVER: impossible_ci_driver
          QS_TRACE_PATH: failed-runtime.csv
        run: |
          if ./build-desktop/quackshot-prototype --smoke 2> sdl-failure.log; then
            echo "SDL_Init unexpectedly succeeded with invalid driver"
            exit 1
          fi
          python3 - <<'PY'
          import csv
          with open("failed-runtime.csv", newline="") as f:
              rows = list(csv.DictReader(f))
          assert [int(r["event"]) for r in rows] == [1, 10], rows
          assert int(rows[1]["detail"]) == 1, rows
          print("SDL_FAILURE_TRACE_PASS: expected initialization failure recorded")
          PY
      - name: Test
        run: ctest --test-dir build-desktop --output-on-failure
